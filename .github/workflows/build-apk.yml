name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Java version cannot be detected."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | cut -d'.' -f1)
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER=$(echo "$JAVA_VER" | cut -d'.' -f2)
          fi
          echo "Active Java Major Version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Active Java version is lower than 17 ($MAJOR_VER)."
            exit 1
          fi
          echo "Java environment verified: version 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Android Release and Debug APKs
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APKs
        run: |
          echo "Checking built APKs in app/build/outputs/apk:"
          find app/build/outputs/apk -name "*.apk" -ls

          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$RELEASE_APK" ] && [ ! -f "$DEBUG_APK" ]; then
            echo "ERROR: Neither release nor debug APK was found."
            exit 1
          fi
          echo "SUCCESS: Verified generated APK(s)."

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrip-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrip-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          ASSETS=()

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "$TMP_DIR/SmartTrip-v1.0.0-release.apk"
            cp "app/build/outputs/apk/release/app-release.apk" "$TMP_DIR/app-release.apk"
            ASSETS+=("$TMP_DIR/SmartTrip-v1.0.0-release.apk" "$TMP_DIR/app-release.apk")
          fi

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "$TMP_DIR/SmartTrip-v1.0.0-debug.apk"
            cp "app/build/outputs/apk/debug/app-debug.apk" "$TMP_DIR/app-debug.apk"
            ASSETS+=("$TMP_DIR/SmartTrip-v1.0.0-debug.apk" "$TMP_DIR/app-debug.apk")
          fi

          echo "Prepared assets: ${ASSETS[*]}"
          echo "asset_dir=$TMP_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: release_step
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TMP_DIR="${{ steps.prepare_asset.outputs.asset_dir }}"
          RELEASE_TAG="v1.0.0-${{ github.run_number }}"
          RELEASE_TITLE="SmartTrip v1.0.0 (Build #${{ github.run_number }})"

          # Gather all apk files to release
          APK_FILES=("$TMP_DIR"/*.apk)

          gh release create "$RELEASE_TAG" "${APK_FILES[@]}" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### SmartTrip Android APK Release (v1.0.0)
          
          **Included Builds:**
          - **SmartTrip-v1.0.0-release.apk** (Optimized Release APK)
          - **SmartTrip-v1.0.0-debug.apk** (Debug APK with logging)
          
          Built automatically via GitHub Actions:
          - Run: #${{ github.run_number }}
          - Commit: ${{ github.sha }}
          - Target Android SDK: 35 (Android 15)
          - Min Android SDK: 24 (Android 7.0+)"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release_step.outcome }}" = "success" ]; then
            RELEASE_TAG="v1.0.0-${{ github.run_number }}"
            echo "### DIRECT APK DOWNLOADS" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Download SmartTrip Release APK](https://github.com/${{ github.repository }}/releases/latest/download/SmartTrip-v1.0.0-release.apk)" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Download SmartTrip Debug APK](https://github.com/${{ github.repository }}/releases/latest/download/SmartTrip-v1.0.0-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release build completed. Artifacts are available in GitHub Actions tab." >> "$GITHUB_STEP_SUMMARY"
          fi
